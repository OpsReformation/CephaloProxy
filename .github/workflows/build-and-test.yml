name: Build and Test CephaloProxy

on:
  push:
    branches:
      - main
      - '**-squid-proxy-container'
    paths:
      - 'container/**'
      - 'tests/**'
      - 'deploy/**'
      - '.github/workflows/build-and-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'container/**'
      - 'tests/**'
      - 'deploy/**'
      - '.github/workflows/build-and-test.yml'
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push container image to registry'
        required: false
        type: boolean
        default: false

env:
  IMAGE_NAME: cephaloproxy
  IMAGE_TAG: ${{ github.sha }}
  REGISTRY: ghcr.io

jobs:
  lint-and-validate:
    name: Lint and Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: container/Dockerfile.distroless
          failure-threshold: warning

      - name: Validate shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find container/ tests/ -name "*.sh" -type f -exec shellcheck {} +

      - name: Check Python syntax
        run: |
          python3 -m py_compile container/healthcheck.py
          python3 -m py_compile container/init-squid.py

  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: lint-and-validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64-only
            platform_tag: linux-amd64
          - target: arm64-only
            platform_tag: linux-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image (${{ matrix.target }})
        uses: docker/bake-action@v6
        with:
          targets: ${{ matrix.target }}
          load: true

      - name: Save container image
        run: |
          docker save cephaloproxy:latest -o /tmp/cephaloproxy-${{ matrix.platform_tag }}.tar

      - name: Upload container image artifact
        uses: actions/upload-artifact@v6
        with:
          name: container-image-${{ matrix.platform_tag }}
          path: /tmp/cephaloproxy-${{ matrix.platform_tag }}.tar
          retention-days: 1

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python unit tests
        run: |
          # Run Python unit tests for init-squid.py if they exist
          if [ -d "tests/unit" ]; then
            python3 -m pytest tests/unit/ -v || echo "No Python tests found or tests skipped"
          fi

      - name: Download container image
        uses: actions/download-artifact@v7
        with:
          name: container-image-linux-amd64
          path: /tmp

      - name: Load container image
        run: |
          docker load -i /tmp/cephaloproxy-linux-amd64.tar

      - name: Test container starts
        run: |
          docker run -d --name test-squid -p 3128:3128 -p 8080:8080 cephaloproxy:latest
          sleep 10
          docker ps | grep test-squid

      - name: Test health endpoints
        run: |
          curl -f http://localhost:8080/health
          curl -f http://localhost:8080/ready

      - name: Test basic proxy functionality
        run: |
          curl -x http://localhost:3128 -I http://example.com

      - name: Cleanup
        if: always()
        run: |
          docker stop test-squid || true
          docker rm test-squid || true

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        test: [basic-proxy, health-checks, acl-filtering]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download container image
        uses: actions/download-artifact@v7
        with:
          name: container-image-linux-amd64
          path: /tmp

      - name: Load container image
        run: |
          docker load -i /tmp/cephaloproxy-linux-amd64.tar

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run integration tests - ${{ matrix.test }}
        run: |
          export IMAGE_NAME="cephaloproxy:latest"
          bats tests/integration/test-${{ matrix.test }}.bats

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download container image
        uses: actions/download-artifact@v7
        with:
          name: container-image-linux-amd64
          path: /tmp

      - name: Load container image
        run: |
          docker load -i /tmp/cephaloproxy-linux-amd64.tar

      - name: Run Trivy vulnerability scanner on amd64
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cephaloproxy:latest
          format: 'sarif'
          output: 'trivy-results-amd64.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cephaloproxy:latest
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'

      # CodeQL upload
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results-amd64.sarif'


  push:
    name: Push Container Image
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, security-scan]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch' && inputs.push_to_registry == true)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download container image artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: container-image-*
          path: /tmp/images
          merge-multiple: false

      - name: Load container images
        run: |
          find /tmp/images -name "*.tar" | while read tarfile; do
            echo "Loading $tarfile"
            docker load -i "$tarfile"
          done
          docker images

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cephaloproxy
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Tag and push tested image
        run: |
          # Extract tags from metadata output (one per line)
          echo "Generated tags:"
          echo "${{ steps.meta.outputs.tags }}"

          # Tag the loaded image with all registry tags
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Tagging: cephaloproxy:latest -> $tag"
              docker tag cephaloproxy:latest "$tag"
              echo "Pushing: $tag"
              docker push "$tag"
            fi
          done <<< "${{ steps.meta.outputs.tags }}"

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      [lint-and-validate, build, test-unit, test-integration, security-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## CephaloProxy Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Lint and Validate: ${{ needs.lint-and-validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.test-unit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.test-integration.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
