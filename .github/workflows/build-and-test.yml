---
name: Build and Test CephaloProxy

on:
  push:
    branches:
      - main
      - '**-squid-proxy-container'
    paths:
      - 'container/**'
      - 'tests/**'
      - 'deploy/**'
      - '.github/workflows/build-and-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'container/**'
      - 'tests/**'
      - 'deploy/**'
      - '.github/workflows/build-and-test.yml'
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push container image to registry'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cephaloproxy

jobs:
  lint-and-validate:
    name: Lint and Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: container/Dockerfile.distroless
          failure-threshold: warning

      - name: Validate shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find container/ tests/ -name "*.sh" -type f -exec shellcheck {} +

      - name: Check Python syntax
        run: |
          python3 -m py_compile container/healthcheck.py
          python3 -m py_compile container/init-squid.py

  # ---------------------------------------------------------------------------
  # Plan: compute the lowercase image repository path and generate Docker
  # metadata (tags, labels) once. Both outputs are shared as artifacts so
  # every downstream job uses identical values.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: lint-and-validate
    outputs:
      image-repo: ${{ steps.image-repo.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set image repository
        id: image-repo
        run: |
          echo "value=$(echo '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-repo.outputs.value }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Upload bake metadata
        uses: actions/upload-artifact@v6
        with:
          name: bake-metadata
          path: ${{ steps.meta.outputs.bake-file }}
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build: one job per platform. Each job pushes its image to the registry
  # by content digest (no tag applied yet) and uploads the digest as an
  # artifact. Tests run against the exact digest — no rebuild.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: plan
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get target architecture
        id: arch
        run: echo "arch=$(echo '${{ matrix.platform }}' | cut -d/ -f2)" >> $GITHUB_OUTPUT

      - name: Download bake metadata
        uses: actions/download-artifact@v7
        with:
          name: bake-metadata
          path: /tmp/bake-metadata

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: bake
        uses: docker/bake-action@v6
        with:
          targets: image
          files: |
            ./docker-bake.hcl
            cwd:///tmp/bake-metadata/docker-metadata-action-bake.json
          set: |
            *.platform=${{ matrix.platform }}
            *.output=type=image,name=${{ needs.plan.outputs.image-repo }},push-by-digest=true,name-canonical=true,push=true
            *.cache-from=type=gha,scope=${{ matrix.platform }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.platform }}
            *.tags=

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ fromJSON(steps.bake.outputs.metadata).image['containerimage.digest'] }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ steps.arch.outputs.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Tests and security scan: pull the amd64 image by its exact digest and
  # test it directly — this is the same binary that will be tagged and shipped.
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [plan, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python unit tests
        run: |
          if [ -d "tests/unit" ]; then
            python3 -m pytest tests/unit/ -v || echo "No Python tests found or tests skipped"
          fi

      - name: Download amd64 digest
        uses: actions/download-artifact@v7
        with:
          name: digest-amd64
          path: /tmp/digests

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image by digest
        run: |
          DIGEST="sha256:$(ls /tmp/digests)"
          docker pull ${{ needs.plan.outputs.image-repo }}@${DIGEST}
          docker tag ${{ needs.plan.outputs.image-repo }}@${DIGEST} cephaloproxy:latest

      - name: Test container starts
        run: |
          docker run -d --name test-squid -p 3128:3128 -p 8080:8080 cephaloproxy:latest
          sleep 10
          docker ps | grep test-squid

      - name: Test health endpoints
        run: |
          curl -f http://localhost:8080/health
          curl -f http://localhost:8080/ready

      - name: Test basic proxy functionality
        run: |
          curl -x http://localhost:3128 -I http://example.com

      - name: Cleanup
        if: always()
        run: |
          docker stop test-squid || true
          docker rm test-squid || true

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [plan, build]
    strategy:
      matrix:
        test: [basic-proxy, health-checks, acl-filtering]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download amd64 digest
        uses: actions/download-artifact@v7
        with:
          name: digest-amd64
          path: /tmp/digests

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image by digest
        run: |
          DIGEST="sha256:$(ls /tmp/digests)"
          docker pull ${{ needs.plan.outputs.image-repo }}@${DIGEST}
          docker tag ${{ needs.plan.outputs.image-repo }}@${DIGEST} cephaloproxy:latest

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run integration tests - ${{ matrix.test }}
        run: |
          export IMAGE_NAME="cephaloproxy:latest"
          bats tests/integration/test-${{ matrix.test }}.bats

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [plan, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download amd64 digest
        uses: actions/download-artifact@v7
        with:
          name: digest-amd64
          path: /tmp/digests

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image by digest
        run: |
          DIGEST="sha256:$(ls /tmp/digests)"
          IMAGE_REF="${{ needs.plan.outputs.image-repo }}@${DIGEST}"
          docker pull ${IMAGE_REF}
          echo "IMAGE_REF=${IMAGE_REF}" >> $GITHUB_ENV

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ---------------------------------------------------------------------------
  # Merge: assemble the per-platform digests into a single multi-arch manifest
  # and apply tags. Only runs when tests pass and a push to the registry is
  # warranted. The imagetools create command is idempotent — re-running it
  # with the same digests produces the same manifest digest.
  # ---------------------------------------------------------------------------
  merge:
    name: Merge and Push
    runs-on: ubuntu-latest
    needs: [plan, test-unit, test-integration, security-scan]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch' && inputs.push_to_registry == true)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download bake metadata
        uses: actions/download-artifact@v7
        with:
          name: bake-metadata
          path: /tmp/bake-metadata

      - name: Download all platform digests
        uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq --raw-output '.target."docker-metadata-action".tags | map("-t " + .) | join(" ")' /tmp/bake-metadata/docker-metadata-action-bake.json) \
            $(printf '${{ needs.plan.outputs.image-repo }}@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect ${{ needs.plan.outputs.image-repo }}

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint-and-validate, plan, build, test-unit, test-integration, security-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## CephaloProxy Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Lint and Validate: ${{ needs.lint-and-validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Plan: ${{ needs.plan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.test-unit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.test-integration.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
